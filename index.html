<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mahjong">
<meta name="theme-color" content="#0d3b2a">
<title>Mahjong</title>
<style>
:root{--bar:#0b2e22;--accent:#f4c542;--text:#f3efe2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;display:flex;flex-direction:column;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--text);
 background:radial-gradient(ellipse at 50% 40%,#1d6b4a 0%,#145238 55%,#0c3726 100%);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
header{display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top) + 3px) calc(env(safe-area-inset-right) + 8px) 3px calc(env(safe-area-inset-left) + 8px);background:rgba(0,0,0,.28);font-size:13px;flex:none}
header .name{font-weight:700;font-size:15px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .stat{background:rgba(255,255,255,.1);border-radius:7px;padding:2px 7px;white-space:nowrap;font-variant-numeric:tabular-nums}
header .stat b{color:var(--accent)}
#boardWrap{flex:1;position:relative;overflow:hidden;min-height:0;touch-action:none}
#board{position:absolute;inset:0;transform-origin:0 0}
footer{display:flex;justify-content:space-around;gap:3px;padding:4px calc(env(safe-area-inset-right) + 4px) calc(env(safe-area-inset-bottom) + 4px) calc(env(safe-area-inset-left) + 4px);background:rgba(0,0,0,.28);flex:none}
footer button{flex:1;min-width:0;max-width:100px;display:flex;flex-direction:column;align-items:center;gap:1px;background:rgba(255,255,255,.08);color:var(--text);border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:4px 1px 3px;font-size:10.5px;font-weight:600;cursor:pointer;font-family:inherit;touch-action:manipulation}
footer button.z{flex:.72;justify-content:center}
footer .sep{width:1px;background:rgba(255,255,255,.18);margin:4px 1px}
footer button:active{background:rgba(255,255,255,.22)}
footer button:disabled{opacity:.4}
footer svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tile{position:absolute;border-radius:calc(var(--w)*.13);background:linear-gradient(150deg,#fffef9 0%,#f6f0de 60%,#e9dfc4 100%);border:1px solid #8f7c55;
 box-shadow:var(--d) var(--d) 0 0 #c9b07c,calc(var(--d) + 1px) calc(var(--d) + 1px) 2px 0 rgba(0,0,0,.5);cursor:pointer;transition:opacity .18s,transform .18s}
.tile svg{position:absolute;inset:1.5%;width:97%;height:97%;pointer-events:none}
.tile::after{content:"";position:absolute;inset:-1px;border-radius:inherit;pointer-events:none;background:transparent;transition:background .15s}
body.dim .tile.blocked::after{background:rgba(25,35,45,.34)}
.tile.sel{background:linear-gradient(150deg,#fff6c4,#ffd84d);border-color:#c27c00;box-shadow:var(--d) var(--d) 0 0 #c99a2e,0 0 0 2px #ff9d00,0 0 10px 3px rgba(255,190,0,.8)}
.tile.hint{animation:hint .5s ease-in-out 4 alternate}
@keyframes hint{from{background:linear-gradient(150deg,#fffef9,#e9dfc4)}to{background:linear-gradient(150deg,#d7f6ff,#6fd3ff);box-shadow:var(--d) var(--d) 0 0 #4a9fc0,0 0 0 2px #00a6ff,0 0 12px 4px rgba(0,170,255,.85)}}
.tile.shake{animation:shake .3s}
@keyframes shake{0%,100%{translate:0}25%{translate:-3px}75%{translate:3px}}
.tile.gone{opacity:0;transform:scale(.6);pointer-events:none}
.tile.hidden{display:none}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 56px);transform:translateX(-50%);background:rgba(0,0,0,.82);color:#fff;padding:8px 14px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50;text-align:center;max-width:90vw}
#toast.show{opacity:1}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:40;padding:16px}
#modal.show{display:flex}
.card{background:#fbf7ea;color:#2a2418;border-radius:18px;padding:18px;width:100%;max-width:420px;max-height:calc(100dvh - 32px);overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.5);-webkit-overflow-scrolling:touch}
.card h2{margin:0 0 6px;font-size:22px}
.card p{margin:6px 0 12px;font-size:15px;line-height:1.4}
.btn{display:block;width:100%;padding:12px;margin:8px 0;border-radius:12px;border:0;font-size:16px;font-weight:700;background:#1d6b4a;color:#fff;cursor:pointer;font-family:inherit}
.btn.alt{background:#e7dfc8;color:#2a2418}
.lay{display:flex;align-items:center;justify-content:space-between;text-align:left;font-weight:600}
.lay small{display:block;font-weight:400;opacity:.85;font-size:12.5px;margin-top:2px}
.lay .st{font-size:12px;font-weight:500;text-align:right;opacity:.9;white-space:nowrap;padding-left:8px}
.lay.cur{outline:3px solid var(--accent)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0;font-size:15px}
.row select{font-size:15px;padding:6px;border-radius:8px}
.row input{width:22px;height:22px}
.sec{font-size:13px;text-transform:uppercase;letter-spacing:.06em;opacity:.6;margin:14px 0 2px}
.stats{font-size:14px;line-height:1.6}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:45}
</style>
</head>
<body class="dim">
<header>
  <div class="name" id="lname">Mahjong</div>
  <div class="stat">Tiles <b id="tilesLeft">0</b></div>
  <div class="stat">Moves <b id="movesLeft">0</b></div>
  <div class="stat" id="timer">0:00</div>
</header>
<div id="boardWrap"><div id="board"></div></div>
<footer>
  <button id="bMenu" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>Menu</button>
  <button id="bHint" aria-label="Hint"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.6 1 2.5h6c0-.9.2-1.7 1-2.5A6 6 0 0 0 12 3z"/></svg>Hint</button>
  <button id="bShuffle" aria-label="Shuffle"><svg viewBox="0 0 24 24"><path d="M3 7h4c4 0 6 10 10 10h4M3 17h4c1.6 0 2.8-1.6 3.9-3.6M13.1 9.6C14.2 7.6 15.4 7 17 7h4M18 4l3 3-3 3M18 14l3 3-3 3"/></svg>Shuffle</button>
  <button id="bUndo" aria-label="Undo"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>Undo</button>
  <button id="bNew" aria-label="New game"><svg viewBox="0 0 24 24"><path d="M5 4h10l4 4v12H5zM12 10v6M9 13h6"/></svg>New</button>
  <span class="sep"></span>
  <button id="zOut" class="z" aria-label="Zoom out"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21M7.5 10.5h6"/></svg><span>−</span></button>
  <button id="zFit" class="z" aria-label="Fit board"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span id="zLbl">100%</span></button>
  <button id="zIn" class="z" aria-label="Zoom in"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21M7.5 10.5h6M10.5 7.5v6"/></svg><span>+</span></button>
</footer>
<div id="toast"></div>
<div id="modal"><div class="card scroll" id="card"></div></div>
<canvas id="confetti"></canvas>
<script>
(function(){
"use strict";
/* ---------- Tile faces ---------- */
// 0-8 dots 1-9, 9-17 bamboo 1-9, 18-26 characters 1-9, 27-30 winds E S W N,
// 31-33 dragons red/green/white, 34-37 flowers, 38-41 seasons
var RED="#c62828",GRN="#13753a",BLU="#1553b8",INK="#14213d";
var CJK='"Noto Serif CJK SC","Noto Serif CJK TC","Songti SC","STSong","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",serif';
function txt(x,y,s,size,fill,extra){return '<text x="'+x+'" y="'+y+'" font-size="'+size+'" fill="'+fill+'" stroke="'+fill+'" stroke-width="'+(size>=30?1.6:.6)+'" stroke-linejoin="round" text-anchor="middle" font-weight="900" font-family=\''+CJK+'\' '+(extra||'')+'>'+s+'</text>';}
function idx(s,fill){return '<text x="2" y="17" font-size="19" fill="'+(fill||BLU)+'" stroke="'+(fill||BLU)+'" stroke-width=".8" font-weight="900" font-family="Arial,Helvetica,sans-serif">'+s+'</text>';}
function dot(cx,cy,r,c){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+c+'"/><circle cx="'+cx+'" cy="'+cy+'" r="'+(r*.52).toFixed(2)+'" fill="#fff"/><circle cx="'+cx+'" cy="'+cy+'" r="'+(r*.32).toFixed(2)+'" fill="'+c+'"/>';}
function stick(cx,cy,len,c,w){w=w||7.5;var x=cx-w/2,y=cy-len/2;
  return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+len+'" rx="'+(w/2)+'" fill="'+c+'"/>'+
  '<rect x="'+(x-1)+'" y="'+(cy-1.3)+'" width="'+(w+2)+'" height="2.6" rx="1.3" fill="'+c+'"/>'+
  '<line x1="'+cx+'" y1="'+(y+3)+'" x2="'+cx+'" y2="'+(y+len-3)+'" stroke="#fff" stroke-width="1.4" stroke-opacity=".75"/>';}
function dotsFace(n){
  var B=BLU,G=GRN,R=RED,s='';
  var L={2:[[30,22,11,G],[30,58,11,B]],3:[[15,17,9.5,B],[30,40,9.5,R],[45,63,9.5,G]],
   4:[[18,24,10,B],[42,24,10,G],[18,56,10,G],[42,56,10,B]],
   5:[[16,19,9,B],[44,19,9,G],[30,40,9,R],[16,61,9,G],[44,61,9,B]],
   6:[[19,16,8.5,G],[41,16,8.5,G],[19,40,8.5,R],[41,40,8.5,R],[19,64,8.5,R],[41,64,8.5,R]],
   7:[[13,12,6.8,G],[30,21,6.8,G],[47,30,6.8,G],[19,50,7.6,R],[41,50,7.6,R],[19,67,7.6,R],[41,67,7.6,R]],
   8:[[19,12,7.4,B],[41,12,7.4,B],[19,30,7.4,B],[41,30,7.4,B],[19,49,7.4,B],[41,49,7.4,B],[19,67,7.4,B],[41,67,7.4,B]],
   9:[[13,17,7.6,B],[30,17,7.6,B],[47,17,7.6,B],[13,40,7.6,R],[30,40,7.6,R],[47,40,7.6,R],[13,63,7.6,G],[30,63,7.6,G],[47,63,7.6,G]]};
  if(n===1){return '<circle cx="30" cy="40" r="24" fill="'+G+'"/><circle cx="30" cy="40" r="19" fill="#fff"/><circle cx="30" cy="40" r="15" fill="'+B+'"/><circle cx="30" cy="40" r="10" fill="#fff"/><circle cx="30" cy="40" r="7" fill="'+R+'"/>';}
  L[n].forEach(function(d){s+=dot(d[0],d[1],Math.min(d[2]*1.13,n>=7?8.4:n>=5?10:13),d[3]);});return s;}
function bambooFace(n){
  var G=GRN,R=RED,B=BLU,s='';
  if(n===1){ // bird-ish emblem: big stalk with leaves
    return '<path d="M30 70 C30 50 30 30 30 12" stroke="'+G+'" stroke-width="9" stroke-linecap="round" fill="none"/>'+
     '<path d="M30 30 C42 22 50 24 54 18 C46 32 40 32 30 36Z" fill="'+G+'"/><path d="M30 46 C18 38 10 40 6 34 C14 48 20 48 30 52Z" fill="'+G+'"/>'+
     '<circle cx="30" cy="13" r="7" fill="'+R+'"/><circle cx="30" cy="13" r="3" fill="#fff"/>'+
     '<rect x="24" y="27" width="12" height="3" rx="1.5" fill="#0b4a24"/><rect x="24" y="50" width="12" height="3" rx="1.5" fill="#0b4a24"/>';}
  var P={2:[[30,22,28,G],[30,58,28,B]],3:[[30,22,28,B],[18,58,28,G],[42,58,28,G]],
   4:[[19,22,28,B],[41,22,28,G],[19,58,28,G],[41,58,28,B]],
   5:[[16,22,28,G],[44,22,28,B],[30,40,28,R],[16,58,28,B],[44,58,28,G]],
   6:[[14,22,28,G],[30,22,28,G],[46,22,28,G],[14,58,28,B],[30,58,28,B],[46,58,28,B]],
   7:[[30,13,18,R],[14,40,21,G],[30,40,21,G],[46,40,21,G],[14,65,21,B],[30,65,21,B],[46,65,21,B]],
   8:[[10,22,28,G],[23,22,28,G],[37,22,28,G],[50,22,28,G],[10,58,28,B],[23,58,28,B],[37,58,28,B],[50,58,28,B]],
   9:[[14,16,21,G],[30,16,21,R],[46,16,21,B],[14,40,21,G],[30,40,21,R],[46,40,21,B],[14,64,21,G],[30,64,21,R],[46,64,21,B]]};
  P[n].forEach(function(d){s+=stick(d[0],d[1],d[2]+2,d[3],n===8?9:n===6||n===9||n===7?10.5:11);});return s;}
var NUM=['一','二','三','四','五','六','七','八','九'];
function charFace(n){return idx(n)+txt(33,39,NUM[n-1],n===1?40:34,INK)+txt(30,76,'萬',36,RED);}
var WIND=[['東','E'],['南','S'],['西','W'],['北','N']];
function windFace(i){return idx(WIND[i][1],RED)+txt(31,62,WIND[i][0],50,INK);}
function dragonFace(i){
  if(i===0)return txt(30,60,'中',56,RED);
  if(i===1)return txt(30,60,'發',52,GRN);
  return '<rect x="8" y="9" width="44" height="62" rx="5" fill="none" stroke="'+BLU+'" stroke-width="7"/><rect x="17" y="18" width="26" height="44" rx="2" fill="none" stroke="'+BLU+'" stroke-width="3"/>';}
function flower(cx,cy,np,pr,pc,cc){var s='';for(var k=0;k<np;k++){var a=360*k/np;
  s+='<ellipse cx="'+cx+'" cy="'+(cy-pr*.55)+'" rx="'+(pr*(np>8?.2:.32))+'" ry="'+(pr*.55)+'" fill="'+pc+'" transform="rotate('+a+' '+cx+' '+cy+')"/>';}
  return s+'<circle cx="'+cx+'" cy="'+cy+'" r="'+(pr*.28)+'" fill="'+cc+'"/>';}
var FL=[['梅',5,'#e0457b'],['蘭',6,'#7b3fbf'],['菊',14,'#e0a100'],['竹',8,'#d84315']];
function flowerFace(i){var f=FL[i];
  return idx(i+1,RED)+'<path d="M30 62 C30 52 31 46 30 40" stroke="'+GRN+'" stroke-width="3" fill="none"/><path d="M30 56 C22 50 16 52 13 48 C18 58 24 58 30 58Z" fill="'+GRN+'"/>'+
   flower(30,33,f[1],25,f[2],'#ffd23f')+txt(30,77,f[0],15,RED);}
var SE=['春','夏','秋','冬'];
function seasonFace(i){var s=idx(i+1,GRN),ic='';
  if(i===0){ic='<path d="M30 62 L30 34" stroke="'+GRN+'" stroke-width="4" stroke-linecap="round"/><path d="M30 44 C18 40 12 30 12 20 C24 22 30 32 30 44Z" fill="#4caf50"/><path d="M30 38 C42 34 48 24 48 14 C36 16 30 26 30 38Z" fill="#2e7d32"/><circle cx="30" cy="30" r="4" fill="#f48fb1"/>';}
  else if(i===1){ic='<g stroke="#f57c00" stroke-width="4" stroke-linecap="round">';for(var k=0;k<8;k++){var a=k*Math.PI/4;ic+='<line x1="'+(30+Math.cos(a)*15).toFixed(1)+'" y1="'+(37+Math.sin(a)*15).toFixed(1)+'" x2="'+(30+Math.cos(a)*23).toFixed(1)+'" y2="'+(37+Math.sin(a)*23).toFixed(1)+'"/>';}ic+='</g><circle cx="30" cy="37" r="11" fill="#ffb300" stroke="#f57c00" stroke-width="2"/>';}
  else if(i===2){ic='<path d="M30 14 L35 26 L46 22 L41 34 L52 38 L40 44 L44 56 L32 50 L30 64 L28 50 L16 56 L20 44 L8 38 L19 34 L14 22 L25 26Z" fill="#e65100" stroke="#bf360c" stroke-width="1.5" stroke-linejoin="round"/><line x1="30" y1="30" x2="30" y2="66" stroke="#6d2b00" stroke-width="2.5"/>';}
  else {ic='<g stroke="#1e88e5" stroke-width="3.5" stroke-linecap="round">';for(var k2=0;k2<6;k2++){var b=k2*Math.PI/3,ex=30+Math.cos(b)*22,ey=38+Math.sin(b)*22;ic+='<line x1="30" y1="38" x2="'+ex.toFixed(1)+'" y2="'+ey.toFixed(1)+'"/>';
    var mx=30+Math.cos(b)*14,my=38+Math.sin(b)*14;ic+='<line x1="'+mx.toFixed(1)+'" y1="'+my.toFixed(1)+'" x2="'+(mx+Math.cos(b+.8)*6).toFixed(1)+'" y2="'+(my+Math.sin(b+.8)*6).toFixed(1)+'"/><line x1="'+mx.toFixed(1)+'" y1="'+my.toFixed(1)+'" x2="'+(mx+Math.cos(b-.8)*6).toFixed(1)+'" y2="'+(my+Math.sin(b-.8)*6).toFixed(1)+'"/>';}ic+='</g>';}
  return s+'<g transform="translate(30 38) scale(1.18) translate(-30 -38)">'+ic+'</g>'+txt(30,78,SE[i],15,GRN);}
function faceSVG(f){
  if(f<9)return dotsFace(f+1); if(f<18)return bambooFace(f-8); if(f<27)return charFace(f-17);
  if(f<31)return windFace(f-27); if(f<34)return dragonFace(f-31); if(f<38)return flowerFace(f-34); return seasonFace(f-38);}
function faceName(f){
  if(f<9)return (f+1)+' of Dots'; if(f<18)return (f-8)+' of Bamboo'; if(f<27)return (f-17)+' of Characters';
  if(f<31)return ['East','South','West','North'][f-27]+' Wind'; if(f<34)return ['Red','Green','White'][f-31]+' Dragon';
  if(f<38)return 'Flower'; return 'Season';}
function group(f){return f>=38?'S':f>=34?'F':String(f);}
function matches(a,b){return group(a)===group(b);}
(function(){var s='<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute;width:0;height:0" aria-hidden="true"><defs>';
  for(var f=0;f<42;f++)s+='<symbol id="mjf'+f+'" viewBox="0 0 60 80">'+faceSVG(f)+'</symbol>';
  document.body.insertAdjacentHTML('afterbegin',s+'</defs></svg>');})();

/* ---------- Layouts (tile units; stored internally in half units) ---------- */
function P(){var a=[];return {
  t:function(x,y,z){a.push({x:Math.round(x*2),y:Math.round(y*2),z:z});return this;},
  r:function(x0,y0,w,h,z){for(var y=0;y<h;y++)for(var x=0;x<w;x++)this.t(x0+x,y0+y,z);return this;},
  get:function(){return a;}};}
var LAYOUTS=[
 {id:'pyramid',name:'Pyramid',desc:'Easy · 56 tiles',build:function(){return P().r(0,0,6,6,0).r(1,1,4,4,1).r(2,2,2,2,2).get();}},
 {id:'cross',name:'Cross',desc:'Medium · 76 tiles',build:function(){var p=P();
   p.r(0,3,12,2,0).r(5,0,2,3,0).r(5,5,2,3,0);
   p.r(2,3,8,2,1).r(5,1,2,2,1).r(5,5,2,2,1);
   p.r(4,3,4,2,2).r(5,2,2,1,2).r(5,5,2,1,2);
   p.r(5,3,2,2,3);return p.get();}},
 {id:'peaks',name:'Twin Peaks',desc:'Medium · 94 tiles',build:function(){var p=P();
   p.r(0,0,5,6,0).r(7,0,5,6,0).r(5,2,2,2,0);
   p.r(1,1,3,4,1).r(8,1,3,4,1);
   p.r(2,2,1,2,2).r(9,2,1,2,2);
   p.t(2,2.5,3).t(9,2.5,3);return p.get();}},
 {id:'fortress',name:'Fortress',desc:'Hard · 110 tiles',build:function(){var p=P();
   p.r(0,0,10,8,0);
   p.r(0,0,2,2,1).r(8,0,2,2,1).r(0,6,2,2,1).r(8,6,2,2,1).r(3,3,4,2,1);
   p.t(0.5,0.5,2).t(8.5,0.5,2).t(0.5,6.5,2).t(8.5,6.5,2).r(4,3.5,2,1,2);return p.get();}},
 {id:'turtle',name:'Turtle',desc:'Classic · 144 tiles',build:function(){var p=P();
   p.r(1,0,12,1,0).r(3,1,8,1,0).r(2,2,10,1,0).r(1,3,12,1,0).r(1,4,12,1,0).r(2,5,10,1,0).r(3,6,8,1,0).r(1,7,12,1,0);
   p.t(0,3.5,0).t(13,3.5,0).t(14,3.5,0);
   p.r(4,1,6,6,1).r(5,2,4,4,2).r(6,3,2,2,3).t(6.5,3.5,4);return p.get();}}
];
function layoutById(id){for(var i=0;i<LAYOUTS.length;i++)if(LAYOUTS[i].id===id)return LAYOUTS[i];return LAYOUTS[0];}
function positionsFor(id,trans){
  var pos=layoutById(id).build().map(function(p){return trans?{x:p.y,y:p.x,z:p.z}:{x:p.x,y:p.y,z:p.z};});
  var mx=Infinity,my=Infinity;pos.forEach(function(p){mx=Math.min(mx,p.x);my=Math.min(my,p.y);});
  pos.forEach(function(p){p.x-=mx;p.y-=my;});return pos;}

/* ---------- Rules ---------- */
function neighbors(pos){
  return pos.map(function(a,i){var nb={up:[],l:[],r:[]};
    pos.forEach(function(b,j){if(i===j)return;var dx=b.x-a.x,dy=b.y-a.y;
      if(b.z===a.z+1&&Math.abs(dx)<2&&Math.abs(dy)<2)nb.up.push(j);

    return nb;});}
function isFree(nb,alive,i){
  var n=nb[i],k;for(k=0;k<n.up.length;k++)if(alive[n.up[k]])return false;

function rnd(n){return Math.floor(Math.random()*n);}

/* Reverse-removal generator: repeatedly remove two currently-free positions from the
   filled layout and give them a matching pair. Playing those removals in the same
   order is a valid solution, so every deal is solvable by construction. */
function generate(pos,nb,idxs,pairs,tries){
  tries=tries||400;var n=pos.length;
  for(var t=0;t<tries;t++){
    var alive=new Array(n).fill(false);idxs.forEach(function(i){alive[i]=true;});
    var order=[],ok=true;
    for(var k=0;k<idxs.length/2;k++){
      var free=[];for(var q=0;q<idxs.length;q++){var i=idxs[q];if(alive[i]&&isFree(nb,alive,i))free.push(i);}
      if(free.length<2){ok=false;break;}
      // prefer higher tiles a bit to avoid stranding stacks
      var a=pickWeighted(free,pos),b;do{b=pickWeighted(free,pos);}while(b===a);
      alive[a]=false;alive[b]=false;order.push([a,b]);}
    if(!ok)continue;
    var pp=shuffleArr(pairs.slice()),face={};
    order.forEach(function(o,k){var pr=Math.random()<.5?pp[k]:[pp[k][1],pp[k][0]];face[o[0]]=pr[0];face[o[1]]=pr[1];});
    return {face:face,solution:order,tries:t+1};}

function pickWeighted(free,pos){var tot=0,w=free.map(function(i){var v=1+pos[i].z*1.5;tot+=v;return v;}),r=Math.random()*tot;
  for(var k=0;k<free.length;k++){r-=w[k];if(r<=0)return free[k];}return free[free.length-1];}

/* ---------- Storage ---------- */
function load(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v==null?d:v;}catch(e){return d;}}
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
var prefs=Object.assign({layout:'turtle',orient:'auto',dim:true},load('mj.prefs',{}));
var stats=Object.assign({streak:0,bestStreak:0,layouts:{}},load('mj.stats',{}));
function lstat(id){return stats.layouts[id]||(stats.layouts[id]={played:0,won:0,best:null,total:0});}

/* ---------- Game state ---------- */
var G=null,NB=null,els=[],sel=-1,running=false,lastTick=0,hintTimer=null;
var board=document.getElementById('board'),wrap=document.getElementById('boardWrap');
function chooseTrans(id){
  if(prefs.orient==='wide')return false;if(prefs.orient==='tall')return true;
  var aw=wrap.clientWidth,ah=wrap.clientHeight;
  return fitW(positionsFor(id,true),aw,ah)>fitW(positionsFor(id,false),aw,ah);}
var R=1.25,DZ=0.08;
function metrics(pos){var m={x:0,y:0,z:0};pos.forEach(function(p){m.x=Math.max(m.x,p.x+2);m.y=Math.max(m.y,p.y+2);m.z=Math.max(m.z,p.z);});return m;}

  return Math.min((aw-pad*2)/(m.x/2+DZ*(m.z+1)),(ah-pad*2)/(R*m.y/2+DZ*(m.z+1)),110);}
function newGame(id){
  id=id||prefs.layout;prefs.layout=id;store('mj.prefs',prefs);
  if(G&&G.counted&&!G.won){stats.streak=0;store('mj.stats',stats);}
  var trans=chooseTrans(id),pos=positionsFor(id,trans);NB=neighbors(pos);
  var all=pos.map(function(_,i){return i;}),pairs=fullPairs();
  pairs=pos.length>=144?pairs:shuffleArr(pairs).slice(0,pos.length/2);

  G={layout:id,trans:trans,pos:pos,face:face,face0:face.slice(),alive:all.map(function(){return true;}),undo:[],elapsed:0,counted:false,won:false,shuffles:0,hints:0,solution:g.solution};

function save(){if(G)store('mj.save',{layout:G.layout,trans:G.trans,face:G.face,face0:G.face0,alive:G.alive,undo:G.undo,elapsed:G.elapsed,counted:G.counted,won:G.won,shuffles:G.shuffles,hints:G.hints});}
function restore(){var s=load('mj.save',null);if(!s||s.won)return false;
  try{var pos=positionsFor(s.layout,s.trans);if(!s.face||s.face.length!==pos.length)return false;
    NB=neighbors(pos);G=Object.assign({},s,{pos:pos});sel=-1;build();running=true;return true;}catch(e){return false;}}

/* ---------- Rendering ---------- */
function build(){
  board.innerHTML='';els=G.pos.map(function(p,i){var d=document.createElement('div');d.className='tile';d.dataset.i=i;
    d.innerHTML='<svg><use href="#mjf'+G.face[i]+'"/></svg>';d.style.zIndex=p.z*1000+p.x*20+p.y;board.appendChild(d);return d;});
  document.getElementById('lname').textContent=layoutById(G.layout).name;layout();refresh();}
function layout(){if(!G)return;
  var aw=wrap.clientWidth,ah=wrap.clientHeight,W=fitW(G.pos,aw,ah),H=W*R,d=Math.max(2,W*DZ),m=metrics(G.pos);
  var bw=m.x/2*W+d*(m.z+1),bh=m.y/2*H+d*(m.z+1),ox=(aw-bw)/2,oy=(ah-bh)/2;
  board.style.setProperty('--w',W+'px');board.style.setProperty('--d',d.toFixed(1)+'px');
  G.pos.forEach(function(p,i){var e=els[i];e.style.left=(ox+p.x/2*W+(m.z-p.z)*d).toFixed(1)+'px';e.style.top=(oy+p.y/2*H+(m.z-p.z)*d).toFixed(1)+'px';
    e.style.width=W.toFixed(1)+'px';e.style.height=H.toFixed(1)+'px';});
  applyZoom();}
function freeList(){var r=[];for(var i=0;i<G.pos.length;i++)if(G.alive[i]&&isFree(NB,G.alive,i))r.push(i);return r;}
function allPairs(){var fr=freeList(),out=[];for(var a=0;a<fr.length;a++)for(var b=a+1;b<fr.length;b++)if(matches(G.face[fr[a]],G.face[fr[b]]))out.push([fr[a],fr[b]]);return out;}
function remaining(){var c=0;G.alive.forEach(function(a){if(a)c++;});return c;}
function refresh(){
  var fr={};freeList().forEach(function(i){fr[i]=1;});
  els.forEach(function(e,i){var al=G.alive[i];e.classList.toggle('hidden',!al&&!e.classList.contains('gone'));if(al)e.classList.remove('gone','hidden');
    e.classList.toggle('blocked',al&&!fr[i]);e.classList.toggle('free',al&&!!fr[i]);e.classList.toggle('sel',i===sel);
    var u=e.firstChild.firstChild;if(u.getAttribute('href')!=='#mjf'+G.face[i])u.setAttribute('href','#mjf'+G.face[i]);});
  document.getElementById('tilesLeft').textContent=remaining();
  document.getElementById('movesLeft').textContent=allPairs().length;
  document.getElementById('bUndo').disabled=!G.undo.length;
  document.body.classList.toggle('dim',!!prefs.dim);tickDisplay();}
function fmt(ms){var s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s/60)%60;s%=60;return (h?h+':'+(m<10?'0':''):'')+m+':'+(s<10?'0':'')+s;}
function tickDisplay(){document.getElementById('timer').textContent=fmt(G?G.elapsed:0);}
setInterval(function(){var now=Date.now();
  if(G&&running&&G.counted&&!G.won&&!modalOpen()&&!document.hidden){G.elapsed+=Math.min(now-lastTick,1000);tickDisplay();if(Math.floor(G.elapsed/1000)%5===0)save();}
  lastTick=now;},250);

/* ---------- Interaction ---------- */
/* Zoom & pan: board is transformed with translate+scale; taps select, drags pan, two fingers pinch. */
var Z={s:Math.min(3,Math.max(1,+prefs.zoom||1)),tx:0,ty:0},ZMIN=1,ZMAX=3,ptrs={},gest=null,lastGesture=0,lastPtrTap=0,zSaveT;
function clampZ(){var aw=wrap.clientWidth,ah=wrap.clientHeight;Z.s=Math.min(ZMAX,Math.max(ZMIN,Z.s));
  Z.tx=Math.min(0,Math.max(aw*(1-Z.s),Z.tx));Z.ty=Math.min(0,Math.max(ah*(1-Z.s),Z.ty));}
function applyZoom(){clampZ();board.style.transform='translate('+Z.tx.toFixed(1)+'px,'+Z.ty.toFixed(1)+'px) scale('+Z.s.toFixed(3)+')';
  document.getElementById('zLbl').textContent=Math.round(Z.s*100)+'%';
  document.getElementById('zOut').disabled=Z.s<=ZMIN+1e-3;document.getElementById('zIn').disabled=Z.s>=ZMAX-1e-3;}
function saveZoom(){clearTimeout(zSaveT);zSaveT=setTimeout(function(){prefs.zoom=+Z.s.toFixed(3);store('mj.prefs',prefs);},150);}
function zoomAt(cx,cy,ns){var cX=(cx-Z.tx)/Z.s,cY=(cy-Z.ty)/Z.s;Z.s=Math.min(ZMAX,Math.max(ZMIN,ns));Z.tx=cx-cX*Z.s;Z.ty=cy-cY*Z.s;applyZoom();saveZoom();}
function zoomCenter(ns){zoomAt(wrap.clientWidth/2,wrap.clientHeight/2,ns);}
function centerPan(){Z.tx=wrap.clientWidth*(1-Z.s)/2;Z.ty=wrap.clientHeight*(1-Z.s)/2;applyZoom();}
function rel(e){var r=wrap.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};}
function ptrList(){return Object.keys(ptrs).map(function(k){return ptrs[k];});}
function startPinch(){var p=ptrList(),a=p[0],b=p[1],mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
  gest={mode:'pinch',d0:Math.max(10,Math.hypot(a.x-b.x,a.y-b.y)),s0:Z.s,cx:(mx-Z.tx)/Z.s,cy:(my-Z.ty)/Z.s};}
wrap.addEventListener('pointerdown',function(e){
  if(e.pointerType==='mouse'&&e.button!==0)return;
  try{wrap.setPointerCapture(e.pointerId);}catch(_){}
  var q=rel(e);ptrs[e.pointerId]={x:q.x,y:q.y};var n=ptrList().length;
  if(n===1)gest={mode:'tap',x0:q.x,y0:q.y,tx0:Z.tx,ty0:Z.ty,cx:e.clientX,cy:e.clientY};
  else if(n===2)startPinch();
  else gest={mode:'done'};});
wrap.addEventListener('pointermove',function(e){
  if(!ptrs[e.pointerId]||!gest)return;var q=rel(e);ptrs[e.pointerId]={x:q.x,y:q.y};
  if(gest.mode==='pinch'){var p=ptrList();if(p.length<2)return;var a=p[0],b=p[1],mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    Z.s=Math.min(ZMAX,Math.max(ZMIN,gest.s0*Math.hypot(a.x-b.x,a.y-b.y)/gest.d0));Z.tx=mx-gest.cx*Z.s;Z.ty=my-gest.cy*Z.s;applyZoom();}
  else if(gest.mode==='tap'||gest.mode==='pan'){var dx=q.x-gest.x0,dy=q.y-gest.y0;
    if(gest.mode==='tap'&&Math.hypot(dx,dy)>9)gest.mode='pan';
    if(gest.mode==='pan'){Z.tx=gest.tx0+dx;Z.ty=gest.ty0+dy;applyZoom();}}
  e.preventDefault();});
function ptrEnd(e){if(!ptrs[e.pointerId])return;delete ptrs[e.pointerId];var n=ptrList().length;
  if(!gest)return;
  if(gest.mode==='tap'&&n===0&&e.type==='pointerup'){gest=null;lastPtrTap=Date.now();hitTap(e.clientX,e.clientY);return;}
  if(gest.mode!=='tap')lastGesture=Date.now();
  if(gest.mode==='pinch'||gest.mode==='pan')saveZoom();
  if(n===1&&gest.mode==='pinch'){var p=ptrList()[0];gest={mode:'pan',x0:p.x,y0:p.y,tx0:Z.tx,ty0:Z.ty};}
  else if(n===0)gest=null;}
wrap.addEventListener('pointerup',ptrEnd);wrap.addEventListener('pointercancel',ptrEnd);
function hitTap(x,y){var el=document.elementFromPoint(x,y),t=el&&el.closest&&el.closest('.tile');if(!t||!G||G.won||modalOpen())return;tap(+t.dataset.i);}
// Fallback for environments that only deliver click (no pointer events); ignored after a pointer tap or a drag/pinch.
board.addEventListener('click',function(ev){var now=Date.now();if(now-lastPtrTap<700||now-lastGesture<700)return;hitTap(ev.clientX,ev.clientY);});
wrap.addEventListener('wheel',function(e){e.preventDefault();var q=rel(e);
  zoomAt(q.x,q.y,Z.s*Math.exp(-e.deltaY*(e.ctrlKey?0.01:0.0025)));},{passive:false});
function ensureVisible(idxs){if(Z.s<=1)return;var W=wrap.getBoundingClientRect(),need=false,x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  idxs.forEach(function(i){var r=els[i].getBoundingClientRect();if(r.left<W.left||r.right>W.right||r.top<W.top||r.bottom>W.bottom)need=true;
    x0=Math.min(x0,r.left);y0=Math.min(y0,r.top);x1=Math.max(x1,r.right);y1=Math.max(y1,r.bottom);});
  if(!need)return;

  var cx=((x0+x1)/2-W.left-Z.tx)/Z.s,cy=((y0+y1)/2-W.top-Z.ty)/Z.s,sw=(x1-x0)/Z.s,sh=(y1-y0)/Z.s;

function tap(i){
  if(!G.alive[i])return;clearHint();
  if(!isFree(NB,G.alive,i)){var e=els[i];e.classList.remove('shake');void e.offsetWidth;e.classList.add('shake');toast('That tile is blocked');return;}
  if(sel===-1){sel=i;}
  else if(sel===i){sel=-1;}
  else if(matches(G.face[sel],G.face[i])){removePair(sel,i);return;}
  else sel=i;
  refresh();}
function startCount(){if(!G.counted){G.counted=true;var s=lstat(G.layout);s.played++;store('mj.stats',stats);}}
function removePair(a,b){
  startCount();G.alive[a]=false;G.alive[b]=false;G.undo.push({t:'r',a:a,b:b});sel=-1;
  [a,b].forEach(function(k){els[k].classList.add('gone');});
  setTimeout(function(){[a,b].forEach(function(k){if(!G.alive[k])els[k].classList.add('hidden');});},200);
  refresh();save();afterMove();}
function afterMove(){
  if(remaining()===0){win();return;}
  if(!allPairs().length)setTimeout(stuck,250);}
function undo(){if(!G||G.won||!G.undo.length)return;clearHint();var u=G.undo.pop();
  if(u.t==='r'){G.alive[u.a]=true;G.alive[u.b]=true;}else if(u.t==='s'){G.face=u.face;G.shuffles=Math.max(0,G.shuffles-1);}
  sel=-1;refresh();save();closeModal();}
function hint(){if(!G||G.won)return;clearHint();var p=allPairs();if(!p.length){stuck();return;}
  var pr=p[rnd(p.length)];G.hints++;sel=-1;refresh();
  ensureVisible(pr);pr.forEach(function(k){els[k].classList.add('hint');});hintTimer=setTimeout(clearHint,2100);}
function clearHint(){clearTimeout(hintTimer);els.forEach(function(e){e.classList.remove('hint');});}
function shuffle(silent){
  if(!G||G.won)return false;clearHint();
  var idxs=[];G.alive.forEach(function(a,i){if(a)idxs.push(i);});if(idxs.length<2)return false;
  var byG={};idxs.forEach(function(i){var k=group(G.face[i]);(byG[k]=byG[k]||[]).push(G.face[i]);});
  var pairs=[];Object.keys(byG).forEach(function(k){var l=shuffleArr(byG[k]);for(var q=0;q+1<l.length;q+=2)pairs.push([l[q],l[q+1]]);});

  else{var fs=shuffleArr(idxs.map(function(i){return G.face[i];}));idxs.forEach(function(i,k){G.face[i]=fs[k];});G.solution=null;}

function restart(){if(!G)return;G.face=G.face0.slice();G.alive=G.alive.map(function(){return true;});G.undo=[];G.elapsed=0;G.won=false;sel=-1;
  build();save();closeModal();running=true;}

/* ---------- Dialogs ---------- */
var modal=document.getElementById('modal'),card=document.getElementById('card');
function modalOpen(){return modal.classList.contains('show');}
function openModal(html){card.innerHTML=html;modal.classList.add('show');card.scrollTop=0;}
function closeModal(){modal.classList.remove('show');}
modal.addEventListener('click',function(e){
  if(e.target===modal&&!(G&&G.won)&&!modal.dataset.locked){closeModal();return;}
  var b=e.target.closest('[data-act]');if(!b)return;var a=b.dataset.act;
  if(a==='close')closeModal();else if(a==='shuffle')shuffle();else if(a==='undo')undo();else if(a==='restart')restart();
  else if(a==='new'){closeModal();newGame(G?G.layout:prefs.layout);}
  else if(a==='layout'){closeModal();newGame(b.dataset.id);}
  else if(a==='menu')menu();});
modal.addEventListener('change',function(e){
  if(e.target.id==='oSel'){prefs.orient=e.target.value;store('mj.prefs',prefs);}
  if(e.target.id==='dimChk'){prefs.dim=e.target.checked;store('mj.prefs',prefs);refresh();}});
function menu(){
  var h='<h2>Mahjong</h2><div class="sec">New game — choose a layout</div>';
  LAYOUTS.forEach(function(L){var s=lstat(L.id);
    h+='<button class="btn alt lay'+(G&&G.layout===L.id?' cur':'')+'" data-act="layout" data-id="'+L.id+'"><span>'+L.name+'<small>'+L.desc+'</small></span><span class="st">Won '+s.won+'/'+s.played+'<br>Best '+(s.best?fmt(s.best):'—')+'</span></button>';});
  h+='<button class="btn alt" data-act="restart">Restart this deal</button>';
  h+='<div class="sec">Settings</div><div class="row"><label for="oSel">Board orientation</label><select id="oSel"><option value="auto">Auto (best fit)</option><option value="wide">Wide</option><option value="tall">Tall (rotated)</option></select></div>';
  h+='<div class="row"><label for="dimChk">Dim blocked tiles</label><input type="checkbox" id="dimChk"'+(prefs.dim?' checked':'')+'></div>';
  var tp=0,tw=0;Object.keys(stats.layouts).forEach(function(k){tp+=stats.layouts[k].played;tw+=stats.layouts[k].won;});
  h+='<div class="sec">Stats</div><div class="stats">Games won: <b>'+tw+'</b> of '+tp+(tp?' ('+Math.round(100*tw/tp)+'%)':'')+'<br>Win streak: <b>'+stats.streak+'</b> (best '+stats.bestStreak+')</div>';
  h+='<p style="font-size:13px;opacity:.75">Tap two matching free tiles to remove them. A tile is free when nothing is on top of it and its left or right side is open. Any Flower matches any Flower; any Season matches any Season. Orientation changes apply to the next new game.</p>';
  h+='<button class="btn" data-act="close">Close</button>';
  openModal(h);card.querySelector('#oSel').value=prefs.orient;}
function stuck(){if(!G||G.won||remaining()===0||allPairs().length||modalOpen())return;
  openModal('<h2>No moves left</h2><p>There are no matching free pairs. Shuffle the remaining '+remaining()+' tiles (kept solvable when possible), undo, or start over.</p>'+
   '<button class="btn" data-act="shuffle">Shuffle tiles</button>'+(G.undo.length?'<button class="btn alt" data-act="undo">Undo last move</button>':'')+
   '<button class="btn alt" data-act="restart">Restart this deal</button><button class="btn alt" data-act="new">New game</button>');}
function win(){
  G.won=true;running=false;var s=lstat(G.layout),nb=!s.best||G.elapsed<s.best;s.won++;s.total+=G.elapsed;if(nb)s.best=G.elapsed;
  stats.streak++;stats.bestStreak=Math.max(stats.bestStreak,stats.streak);store('mj.stats',stats);save();confetti();
  setTimeout(function(){openModal('<h2 id="winTitle">🎉 You won!</h2><p>'+layoutById(G.layout).name+' cleared in <b>'+fmt(G.elapsed)+'</b>'+(nb?' — new best time!':' (best '+fmt(s.best)+')')+
   '<br>Shuffles: '+G.shuffles+' · Hints: '+G.hints+'<br>Wins on this layout: '+s.won+' · Streak: '+stats.streak+'</p>'+
   '<button class="btn" data-act="new">Play again</button><button class="btn alt" data-act="menu">Choose layout</button>');},450);}
var toastT;function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show');},1600);}
